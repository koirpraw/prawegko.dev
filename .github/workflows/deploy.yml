name: Deploy to S3 / CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  CLOUDFRONT_DIST_ID: E27SNJMPZ4KHN5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Debug — check secret
        run: |
          echo "Secret length: ${#AWS_ROLE_ARN_VALUE}"
          echo "actor=${{ github.actor }}"
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
        env:
          AWS_ROLE_ARN_VALUE: ${{ secrets.AWS_ROLE_ARN }}

      - name: STS with hardcoded ARN
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Got token length: ${#ID_TOKEN}"
          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::180294201976:role/prawegko-dev-github-deploy" \
            --role-session-name github-actions-deploy \
            --web-identity-token "$ID_TOKEN" \
            --region us-east-1 \
            --duration-seconds 900

      - name: STS with secret ARN
        if: always()
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Got token length: ${#ID_TOKEN}"
          aws sts assume-role-with-web-identity \
            --role-arn "${{ secrets.AWS_ROLE_ARN }}" \
            --role-session-name github-actions-deploy-2 \
            --web-identity-token "$ID_TOKEN" \
            --region us-east-1 \
            --duration-seconds 900