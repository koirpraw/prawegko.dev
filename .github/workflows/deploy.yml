name: Deploy to S3 / CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  CLOUDFRONT_DIST_ID: E27SNJMPZ4KHN5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Decode OIDC token claims
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== Token length: ${#ID_TOKEN} ==="
          PAYLOAD=$(echo "$ID_TOKEN" | cut -d'.' -f2)
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq . || echo "$PAYLOAD" | base64 -d 2>/dev/null || echo "RAW PAYLOAD: $PAYLOAD"

      - name: STS with hardcoded ARN
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::180294201976:role/prawegko-dev-github-deploy" \
            --role-session-name github-actions-deploy \
            --web-identity-token "$ID_TOKEN" \
            --region us-east-1 \
            --duration-seconds 900