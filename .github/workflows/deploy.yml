name: Deploy to S3 / CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  CLOUDFRONT_DIST_ID: E27SNJMPZ4KHN5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Debug — OIDC token claims
        run: |
          echo "actor=${{ github.actor }}"
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"

      - name: Get OIDC token and assume role (raw STS)
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Got token length: ${#ID_TOKEN}"
          aws sts assume-role-with-web-identity \
            --role-arn "${{ secrets.AWS_ROLE_ARN }}" \
            --role-session-name github-actions-deploy \
            --web-identity-token "$ID_TOKEN" \
            --region us-east-1 \
            --duration-seconds 900

      - name: Sync to S3
        run: aws s3 sync dist/ s3://prawegko.dev --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"