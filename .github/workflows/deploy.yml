name: Deploy to S3 / CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  CLOUDFRONT_DIST_ID: E27SNJMPZ4KHN5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the sitemap derives each URL's <lastmod> from the last commit
          # that touched its source file. A shallow clone would report this commit's date.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::180294201976:role/prawegko-dev-github-deploy
          aws-region: us-east-1
          role-session-name: github-actions-deploy

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://prawegko.dev --delete

      # `aws s3 sync` guesses the MIME type from the extension and stores .xml as
      # application/xml. Re-uploading the feed explicitly is what makes it
      # application/rss+xml, and it runs after the sync so it always wins.
      - name: Serve the feed as application/rss+xml
        run: |
          aws s3 cp dist/rss.xml s3://prawegko.dev/rss.xml \
            --content-type "application/rss+xml" \
            --no-cli-pager

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --paths "/*" \
            --no-cli-pager
